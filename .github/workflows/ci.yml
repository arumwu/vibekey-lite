name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app bundle
        run: ./build-app.sh
      - name: Verify app signature
        run: codesign --verify --deep --strict '.build/app/VibeKey Lite.app'
